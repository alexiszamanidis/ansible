---
- name: Create personal directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ personal_directories }}"
  tags: [personal-env]

- name: Render personal env file
  ansible.builtin.template:
    src: .personal_env.j2
    dest: "{{ personal_env_file_path }}"
    mode: "0644"
  tags: [personal-env]

- name: Check if repositories exist
  ansible.builtin.stat:
    path: "{{ personal_projects_dir_path }}/{{ item }}"
  register: repositories_stats
  loop: "{{ personal_projects }}"

- name: Clone repositories
  ansible.builtin.git:
    repo: git@github.com:{{ github_user }}/{{ item.item }}.git
    dest: "{{ personal_projects_dir_path }}/{{ item.item }}"
    recursive: true
    update: true
    accept_hostkey: true
    key_file: "{{ dest_key_file_path }}"
    version: master
  when: not item.stat.exists or not item.stat.isdir
  loop: "{{ repositories_stats.results }}"
  loop_control:
    label: "{{ item.item }} -> {{ personal_projects_dir_path }}/{{ item.item }}"
