---
- name: Install fzf
  become: true
  ansible.builtin.apt:
    name: [fzf]

- name: Create bin directory
  ansible.builtin.file:
    path: "{{ bin_dir_path }}"
    state: directory
    mode: "0755"

- name: Install fd
  become: true
  ansible.builtin.apt:
    name: [fd-find]

- name: Check that the fd exists
  ansible.builtin.stat:
    path: "{{ bin_dir_path }}/fd"
  register: fd_exists

- name: Remove the fd folder
  ansible.builtin.file:
    path: "{{ bin_dir_path }}/fd"
    state: absent
  when: fd_exists.stat.isdir is defined and fd_exists.stat.isdir

- name: Link fd
  ansible.builtin.file:
    path: "{{ bin_dir_path }}/fd"
    src: /usr/bin/fdfind
    state: link
    force: true

- name: Install bat
  become: true
  ansible.builtin.apt:
    name: [bat]
    state: present

- name: Link bat command
  ansible.builtin.file:
    path: "{{ bin_dir_path }}/bat"
    src: /usr/bin/batcat
    state: link
    force: true
