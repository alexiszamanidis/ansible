---
- name: Install nodejs and npm
  become: true
  ansible.builtin.apt:
    name: [nodejs, npm]

- name: Create .npm-global directory
  ansible.builtin.file:
    path: "{{ home }}/.local/.npm-global"
    state: directory
    mode: "0755"

- name: Add npm to path
  ansible.builtin.shell: PATH={{ home }}/.local/.npm-global/bin:$PATH
  changed_when: false

- name: Npm global settings
  ansible.builtin.command: npm config set prefix {{ home }}/.local/.npm-global
  changed_when: false

- name: Download nvm
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh
    dest: "{{ home }}/.nvm-installer"
    mode: "0755"

- name: Install nvm
  ansible.builtin.shell: "{{ home }}/.nvm-installer && rm -rf {{ home }}/.nvm-installer"
  changed_when: false
