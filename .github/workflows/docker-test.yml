---
name: docker-test

on: workflow_dispatch

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: ansible-ubuntu_dev:latest
          build-args: |
            USERNAME=alexzam
            USER_ID=1000
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,scope=docker-test,mode=max
      - name: Run Ansible in Docker
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$HOME/.vault_pass.txt"
          chmod 0600 "$HOME/.vault_pass.txt"
          docker compose up --exit-code-from ubuntu_dev
