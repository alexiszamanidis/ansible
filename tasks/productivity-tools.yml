---
- name: Install productivity tools
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ productivity_apt_packages }}"

- name: Check if file exists - {{ gnome_settings_file_path }}
  ansible.builtin.stat:
    path: "{{ gnome_settings_file_path }}"
  register: gnome_settings_stats

- name: Create template file - {{ gnome_settings_file_path }}
  ansible.builtin.template:
    src: gnome-settings.desktop.j2
    dest: "{{ gnome_settings_file_path }}"
    mode: "0755"
  when: not gnome_settings_stats.stat.exists or gnome_settings_stats.stat.isdir

- name: Check if file exists - {{ downloads_file_path }}
  ansible.builtin.stat:
    path: "{{ downloads_file_path }}"
  register: downloads_stats

- name: Create template file - {{ downloads_file_path }}
  ansible.builtin.template:
    src: downloads.desktop.j2
    dest: "{{ downloads_file_path }}"
    mode: "0755"
  when: not downloads_stats.stat.exists or downloads_stats.stat.isdir
