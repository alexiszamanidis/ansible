---
- name: Check if Cursor Agent is installed
  ansible.builtin.stat:
    path: "{{ bin_dir_path }}/agent"
  register: cursor_agent_stat

- name: Download Cursor Agent installer
  ansible.builtin.get_url:
    url: https://cursor.com/install
    dest: /tmp/cursor-install.sh
    mode: "0755"

- name: Install Cursor Agent
  ansible.builtin.command:
    cmd: /tmp/cursor-install.sh
    creates: "{{ bin_dir_path }}/agent"
  when: not cursor_agent_stat.stat.exists

- name: Update Cursor Agent to latest
  ansible.builtin.command: "{{ bin_dir_path }}/agent update"
  when: cursor_agent_stat.stat.exists
  register: cursor_agent_update
  changed_when: (cursor_agent_update.stdout | default('') | trim) != 'Checking for updates...'

- name: Remove Cursor apt repository files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/cursor.list
    - /etc/apt/sources.list.d/cursor.sources
    - /usr/share/keyrings/anysphere.gpg

- name: Resolve latest Cursor desktop .deb URL
  ansible.builtin.uri:
    url: https://api2.cursor.sh/updates/download/golden/linux-x64-deb/cursor/
    method: HEAD
    follow_redirects: none
    status_code: [301, 302, 303, 307, 308]
  register: cursor_deb_redirect
  check_mode: false

- name: Set Cursor desktop package facts
  ansible.builtin.set_fact:
    cursor_deb_url: "{{ cursor_deb_redirect.location }}"
    cursor_deb_version: "{{ cursor_deb_redirect.location | basename | regex_replace('^cursor_(.+)_amd64\\.deb$', '\\1') }}"
  when: cursor_deb_redirect.location is defined

- name: Check installed Cursor desktop version
  ansible.builtin.command:
    cmd: dpkg-query --show --showformat='${Version}' cursor
  register: cursor_deb_installed
  changed_when: false
  failed_when: false

# The download name is cursor_<version>_amd64.deb, while dpkg records
# <version>-<build>. Treat an installed build of that version as current.
- name: Determine whether Cursor desktop install is required
  ansible.builtin.set_fact:
    cursor_deb_install_required: "{{ cursor_deb_installed.rc != 0 or (cursor_deb_installed.stdout != cursor_deb_version and cursor_deb_installed.stdout is not match('^' ~ (cursor_deb_version | regex_escape) ~ '-')) }}"
  when: cursor_deb_url is defined

- name: Download latest Cursor desktop .deb
  ansible.builtin.get_url:
    url: "{{ cursor_deb_url }}"
    dest: /tmp/cursor_amd64.deb
    mode: "0644"
  when: cursor_deb_install_required | default(false) | bool

# ansible.builtin.apt refuses this package: it Conflicts with its own name,
# and python-apt reports that as breaking the installed cursor package.
# apt-get installs the upgrade correctly.
- name: Install or upgrade Cursor desktop app
  become: true
  ansible.builtin.command:
    argv:
      - apt-get
      - install
      - -y
      - -o
      - Dpkg::Options::=--force-confdef
      - -o
      - Dpkg::Options::=--force-confold
      - /tmp/cursor_amd64.deb
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: cursor_deb_install
  changed_when: "'Unpacking cursor' in cursor_deb_install.stdout"
  when: cursor_deb_install_required | default(false) | bool
