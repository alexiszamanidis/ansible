---
- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ fonts_dir_path }}"
    state: directory
    mode: "0755"

- name: Download Nerd Fonts
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ryanoasis/nerd-fonts/master/patched-fonts/Hack/{{ font_name }}-{{ item }}.ttf
    dest: "{{ fonts_dir_path }}/{{ font_name }}-{{ item }}.ttf"
    mode: "0755"
  loop: "{{ font_styles }}"
  loop_control:
    label: "{{ font_name }}-{{ item }}.ttf -> {{ fonts_dir_path }}/{{ font_name }}-{{ item }}.ttf"

- name: Update font cache
  ansible.builtin.command: fc-cache -f -v
  changed_when: false
