---
name: ci

on: [pull_request, push]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npm run format

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat(format): apply formatting changes"

  lint:
    runs-on: ubuntu-latest
    needs: [format]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install ansible==14.2.0 ansible-lint==25.7.0

      - name: Write Ansible Vault password to file
        run: echo "${{ secrets.VAULT_PASSWORD }}" > /home/runner/.vault_pass.txt
        shell: bash

      - name: Install Ansible Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint Ansible playbook
        run: ansible-lint --fix -c ./.ansible-lint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat(lint): apply linting changes"
