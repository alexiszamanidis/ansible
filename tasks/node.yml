---
- name: Install nodejs and npm
  become: true
  ansible.builtin.apt:
    name: [nodejs, npm]

- name: Create .npm-global directory
  ansible.builtin.file:
    path: "{{ home }}/.local/.npm-global"
    state: directory
    mode: "0755"

- name: Add npm to path
  ansible.builtin.shell: PATH={{ home }}/.local/.npm-global/bin:$PATH
  changed_when: false

- name: Npm global settings
  ansible.builtin.command: npm config set prefix {{ home }}/.local/.npm-global
  changed_when: false

- name: Check if nvm is installed
  ansible.builtin.stat:
    path: "{{ home }}/.nvm/nvm.sh"
  register: nvm_sh

- name: Download nvm
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh
    dest: "{{ home }}/.nvm-installer"
    mode: "0755"
  when: not nvm_sh.stat.exists

- name: Install nvm
  ansible.builtin.command: "{{ home }}/.nvm-installer"
  args:
    creates: "{{ home }}/.nvm/nvm.sh"
  when: not nvm_sh.stat.exists

- name: Remove nvm installer
  ansible.builtin.file:
    path: "{{ home }}/.nvm-installer"
    state: absent

- name: Install Node.js via nvm {{ nvm_node_version }}
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install "{{ nvm_node_version }}"
    nvm alias default "{{ nvm_node_version }}"
    nvm use --delete-prefix "v{{ nvm_node_version }}" --silent
  args:
    executable: /bin/bash
    creates: "{{ home }}/.nvm/versions/node/v{{ nvm_node_version }}"
